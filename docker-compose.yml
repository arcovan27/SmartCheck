services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartcheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartcheck"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: smartcheck-api
    restart: unless-stopped
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smartcheck
      JWT_SECRET: supersecretkey
      WEB_ORIGIN: http://192.168.2.100:5175
      UPLOAD_DIR: uploads
      RUN_SEED_ON_START: "false"
    volumes:
      - ./apps/api/uploads:/app/apps/api/uploads
      - ./apps/api:/app/apps/api
      - ./package.json:/app/package.json
      - /app/node_modules
    ports:
      - "3334:3333"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: smartcheck-web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://192.168.2.100:3334
    volumes:
      - ./apps/web:/app/apps/web
      - ./package.json:/app/package.json
      - /app/node_modules
    ports:
      - "5175:5173"
    depends_on:
      - api

volumes:
  postgres_data:
    name: smartcheck_postgres_data
